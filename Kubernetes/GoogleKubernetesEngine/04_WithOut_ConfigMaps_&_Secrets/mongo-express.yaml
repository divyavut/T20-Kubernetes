apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: mongo-express 
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: mongo-express 
  template: 
    metadata: 
      name: mongo-express-pod 
      labels: 
        app: mongo-express
    spec: 
      containers: 
      - name: mongo-express
        image: mongo-express:latest 
        ports: 
        - containerPort: 8081 
        env: 
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          value: "admin"
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          value: "password123"
        - name: ME_CONFIG_MONGODB_SERVER
          value: "mongo-service"
        - name: ME_CONFIG_BASICAUTH_USERNAME
          value: "mongo_admin"  # Web login username
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          value: "mongo_pass"   # Web login password
---
  apiVersion: v1 
  kind: Service 
  metadata: 
    name: mongo-express-service 
  spec: 
    selector:
      app: mongo-express
    type: NodePort 
    ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081 
    