apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: nginx-deployment 
  namespace: devopsteam
spec: 
  replicas: 10
  selector: 
   matchLabels:
     app: my-nginx
  template:
    metadata:
      name: nginx-pod
      labels:
        app: my-nginx
    spec:
      containers:
        - name: nginx01
          image: nginx
          ports:
            - containerPort: 80
          resources:
            requests: 
              cpu: "60m" # milli core
              memory: "100Mi" #Mebi bytes
            limits: 
              cpu: "120m"
              memory: "200Mi"
