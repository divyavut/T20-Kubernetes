apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: mongo
spec: 
  replicas: 1 
  selector: 
    matchLabels:
      app: mongo 
  template: 
    metadata:
      name: mongo 
      labels: 
        app: mongo 
    spec: 
      containers: 
      - name: mongo 
        image: mongo:latest 
        ports: 
        - containerPort: 27017
        env: 
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo_root_user
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo_root_password
          
--- 
apiVersion: v1 
kind: Service
metadata: 
  name: mongo
spec: 
  type: ClusterIP
  ports: 
  - protocol: TCP
    port: 27017
    targetPort: 27017
