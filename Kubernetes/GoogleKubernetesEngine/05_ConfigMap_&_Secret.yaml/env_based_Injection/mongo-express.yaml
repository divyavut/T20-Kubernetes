apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: mongo-express 
spec: 
  replicas: 1 
  selector: 
    matchLabels:
      app: mongo-express 
  template: 
    metadata:
      name: mongo-express
      labels: 
        app: mongo-express 
    spec: 
      containers: 
      - name: mongo-express
        image: mongo-express
        ports: 
        - containerPort: 8081 
        env: 
        - name: ME_CONFIG_MONGODB_SERVER
          valueFrom: 
            configMapKeyRef: 
              name: mongo-configmap 
              key: database_url
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo_root_user
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo_root_password
        - name: ME_CONFIG_BASICAUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo_web_user
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo_web_password
       
---
apiVersion: v1 
kind: Service 
metadata: 
  name: mongo-express 
spec: 
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8081
  selector: 
    app: mongo-express
  
   

